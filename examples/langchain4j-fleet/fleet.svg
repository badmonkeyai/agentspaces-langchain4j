<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="0 0 1260 800" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <title>Example 19: two plain-Java peers, the fleet between them, and a LangChain4j AiService whose tools and model are the fleet</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrow-model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c6a8a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5651d"/>
    </marker>
    <style>
      .peer { fill: #f7f8fa; stroke: #3b4252; stroke-width: 1.5; }
      .fleet { fill: #eef3f8; stroke: #4c6a8a; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1; }
      .agent { fill: #fff8ee; stroke: #b5651d; stroke-width: 1.2; }
      .ai { fill: #eef7f0; stroke: #2f7d4f; stroke-width: 1.2; }
      .space { fill: #ffffff; stroke: #4c6a8a; stroke-width: 1.2; }
      .card { fill: #fffbe6; stroke: #8a7a2a; stroke-width: 1; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2430; }
      .label { fill: #1f2430; }
      .muted { fill: #5b6270; font-size: 12px; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2430; }
      .flow { stroke: #3b4252; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .flow-model { stroke: #4c6a8a; stroke-width: 1.4; fill: none; marker-end: url(#arrow-model); }
      .flow-accent { stroke: #b5651d; stroke-width: 1.4; fill: none; marker-end: url(#arrow-accent); }
      .step { fill: #1f2430; font-weight: 700; font-size: 12px; }
      .stepbg { fill: #ffffff; stroke: #1f2430; stroke-width: 1; }
    </style>
  </defs>

  <!-- ============ WORKER PEER ============ -->
  <rect class="peer" x="20" y="20" width="400" height="700" rx="10"/>
  <text class="title" x="36" y="46">Worker peer  (WorkerApp)</text>
  <text class="muted" x="36" y="64">worker.yaml · 127.0.0.1:7721 · founds ai-fleet · has the OpenAI key</text>

  <rect class="box" x="36" y="80" width="368" height="44" rx="6"/>
  <text class="label" x="48" y="98">FleetRuntime</text>
  <text class="muted" x="48" y="114">the peer: identity, group, spaces, ticking, card refresh</text>

  <rect class="box" x="36" y="134" width="368" height="44" rx="6"/>
  <text class="label" x="48" y="152">LangChain4jFleet</text>
  <text class="muted" x="48" y="168">listeners(): take-lease + usage · modelServer(catalog)</text>

  <rect class="agent" x="36" y="196" width="368" height="118" rx="6"/>
  <text class="label" x="48" y="216" font-weight="600">Summarizer  — @AgentSpec("summarizer")</text>
  <text class="mono" x="48" y="236">@SpaceTake(space = "tasks", lease = "2m")</text>
  <text class="mono" x="48" y="254">Summary summarize(Brief brief)</text>
  <text class="muted" x="48" y="274">calls the peer's own OpenAI ChatModel; the take-lease</text>
  <text class="muted" x="48" y="290">listener renews the 2m lease on every model round-trip</text>
  <text class="muted" x="48" y="306">→ publishes AgentCard "summarizer"</text>

  <rect class="agent" x="36" y="326" width="368" height="86" rx="6"/>
  <text class="label" x="48" y="346" font-weight="600">Pricer  — @AgentSpec("pricer")</text>
  <text class="mono" x="48" y="366">@SpaceTake(space = "tasks")</text>
  <text class="mono" x="48" y="384">Quote price(PriceRequest request)</text>
  <text class="muted" x="48" y="402">no model at all → publishes AgentCard "pricer"</text>

  <rect class="box" x="36" y="426" width="368" height="100" rx="6"/>
  <text class="label" x="48" y="446" font-weight="600">OpenAI ChatModel  gpt-4.1-mini</text>
  <text class="muted" x="48" y="464">.listeners(fleet.listeners())</text>
  <text class="muted" x="48" y="482">TakeLeaseListener: keeps the in-flight take alive</text>
  <text class="muted" x="48" y="498">FleetUsageListener: tokens per model and agent,</text>
  <text class="muted" x="48" y="514">summed across the fleet (usage.enabled)</text>

  <rect class="box" x="36" y="540" width="368" height="80" rx="6"/>
  <text class="label" x="48" y="560" font-weight="600">ModelServer  (model-server.enabled)</text>
  <text class="muted" x="48" y="578">takes ModelRequests for gpt-4.1-mini from model-requests,</text>
  <text class="muted" x="48" y="594">calls the OpenAI model, completes with a ModelResponse</text>
  <text class="muted" x="48" y="610">(or ModelChunks when streamed); lease renewed while it runs</text>

  <text class="muted" x="36" y="650">Only this peer has a provider key. Another worker peer</text>
  <text class="muted" x="36" y="666">with the same YAML races for the same tasks: if this one</text>
  <text class="muted" x="36" y="682">dies mid-task, its lease lapses and the other finishes it.</text>

  <!-- ============ THE FLEET ============ -->
  <rect class="fleet" x="440" y="20" width="380" height="700" rx="10"/>
  <text class="title" x="456" y="46">The fleet  (group ai-fleet)</text>
  <text class="muted" x="456" y="64">replicated over TCP gossip; leased, signed entries</text>

  <rect class="box" x="456" y="80" width="348" height="150" rx="6"/>
  <text class="label" x="468" y="100" font-weight="600">ad-cache  (discovery)</text>
  <rect class="card" x="468" y="112" width="324" height="44" rx="4"/>
  <text class="mono" x="476" y="130">AgentCard summarizer</text>
  <text class="muted" x="476" y="146">action: take Brief → Summary in "tasks"</text>
  <rect class="card" x="468" y="164" width="324" height="44" rx="4"/>
  <text class="mono" x="476" y="182">AgentCard pricer</text>
  <text class="muted" x="476" y="198">action: take PriceRequest → Quote in "tasks"</text>
  <text class="muted" x="468" y="222">cards refresh on a cadence; a departed peer's cards lapse</text>

  <rect class="space" x="456" y="250" width="348" height="190" rx="6"/>
  <text class="label" x="468" y="270" font-weight="600">space "tasks"</text>
  <text class="muted" x="468" y="290">a tool call writes its input here…</text>
  <text class="mono" x="480" y="310">Brief{topic, sentences}</text>
  <text class="mono" x="480" y="328">PriceRequest{item, quantity}</text>
  <text class="muted" x="468" y="350">…the agent takes it (one taker, a lease) and</text>
  <text class="muted" x="468" y="366">completes the take with the result:</text>
  <text class="mono" x="480" y="386">Summary{topic, text}</text>
  <text class="mono" x="480" y="404">Quote{item, quantity, total}</text>
  <text class="muted" x="468" y="426">results correlate by the records' shared fields</text>

  <rect class="space" x="456" y="460" width="348" height="150" rx="6"/>
  <text class="label" x="468" y="480" font-weight="600">space "model-requests"</text>
  <text class="muted" x="468" y="500">the model service's wire (agentspaces-model-wire):</text>
  <text class="mono" x="480" y="520">ModelRequest{id, model, messages, tools}</text>
  <text class="mono" x="480" y="538">ModelResponse / ModelChunk / ModelCancel</text>
  <text class="muted" x="468" y="560">the same records a Spring AI or Micronaut peer</text>
  <text class="muted" x="468" y="576">writes, so any of them can serve this orchestrator</text>
  <text class="muted" x="468" y="596">(or be served by this worker)</text>

  <text class="muted" x="456" y="640">Entries are typed by class name, leased so they</text>
  <text class="muted" x="456" y="656">clean up on their own, and signed by the writing</text>
  <text class="muted" x="456" y="672">peer; the authorizer says who may serve a model.</text>

  <!-- ============ ORCHESTRATOR PEER ============ -->
  <rect class="peer" x="840" y="20" width="400" height="700" rx="10"/>
  <text class="title" x="856" y="46">Orchestrator peer  (OrchestratorApp)</text>
  <text class="muted" x="856" y="64">orchestrator.yaml · 127.0.0.1:7722 · seeds :7721 · no key</text>

  <rect class="box" x="856" y="80" width="368" height="44" rx="6"/>
  <text class="label" x="868" y="98">FleetRuntime</text>
  <text class="muted" x="868" y="114">joins ai-fleet through the seed; the same two spaces</text>

  <rect class="box" x="856" y="134" width="368" height="150" rx="6"/>
  <text class="label" x="868" y="152" font-weight="600">LangChain4jFleet</text>
  <text class="label" x="868" y="174">catalog()  — FleetToolCatalog</text>
  <text class="muted" x="868" y="190">the foreign cards as tools, refreshed every 1s:</text>
  <text class="mono" x="880" y="208">fleet_summarizer_Brief   fleet_pricer_PriceRequest</text>
  <text class="label" x="868" y="232">tools()  — FleetToolProvider (a LangChain4j ToolProvider)</text>
  <text class="muted" x="868" y="248">ToolSpecification from each input record's JSON schema</text>
  <text class="label" x="868" y="268">chatModel()  — FleetChatModel (a LangChain4j ChatModel)</text>

  <rect class="ai" x="856" y="300" width="368" height="180" rx="6"/>
  <text class="label" x="868" y="320" font-weight="600">Orchestrator  — a LangChain4j AiService</text>
  <text class="mono" x="868" y="342">AiServices.builder(Orchestrator.class)</text>
  <text class="mono" x="868" y="360">    .chatModel(fleet.chatModel())    // the fleet</text>
  <text class="mono" x="868" y="378">    .toolProvider(fleet.tools())     // the workers</text>
  <text class="mono" x="868" y="396">    .build()</text>
  <text class="mono" x="868" y="420">String plan(@UserMessage String request)</text>
  <text class="muted" x="868" y="440">@SystemMessage: "coordinate a fleet of specialist agents;</text>
  <text class="muted" x="868" y="456">use the fleet tools, then answer with a short plan"</text>
  <text class="muted" x="868" y="472">Nothing in this interface is fleet-specific.</text>

  <rect class="box" x="856" y="496" width="368" height="124" rx="6"/>
  <text class="label" x="868" y="516" font-weight="600">The tool loop, run by AiServices on this peer</text>
  <text class="muted" x="868" y="536">each model round-trip is one ModelRequest through the</text>
  <text class="muted" x="868" y="552">space; the model answers with tool calls; AiServices runs</text>
  <text class="muted" x="868" y="568">them with FleetToolProvider's executors, which write the</text>
  <text class="muted" x="868" y="584">input into "tasks" and await the correlated result; the</text>
  <text class="muted" x="868" y="600">results go back as tool messages on the next round-trip.</text>

  <text class="muted" x="856" y="650">The server never runs the caller's tools, and the</text>
  <text class="muted" x="856" y="666">caller never holds the server's key: credentials sit</text>
  <text class="muted" x="856" y="682">on one peer, the loop on another, the work wherever</text>
  <text class="muted" x="856" y="698">the cards say it is taken.</text>

  <!-- ============ FLOWS ============ -->
  <!-- 1: cards published -->
  <path class="flow-accent" d="M 404 255 C 430 255, 430 134, 468 134"/>
  <path class="flow-accent" d="M 404 369 C 430 369, 430 186, 468 186"/>
  <!-- 1': cards read into the catalog -->
  <path class="flow-accent" d="M 792 160 C 830 160, 830 190, 868 190"/>
  <!-- 2: model request / response -->
  <path class="flow-model" d="M 868 268 C 830 268, 830 520, 804 520"/>
  <path class="flow-model" d="M 456 560 C 430 560, 430 580, 404 580"/>
  <path class="flow-model" d="M 404 596 C 430 596, 430 545, 456 545"/>
  <!-- 3: tool call writes Brief / PriceRequest, agents take, results back -->
  <path class="flow" d="M 868 584 C 830 584, 830 310, 804 310"/>
  <path class="flow" d="M 456 316 C 430 316, 430 250, 404 250"/>
  <path class="flow" d="M 456 328 C 430 328, 430 366, 404 366"/>
  <path class="flow" d="M 404 290 C 430 290, 430 388, 456 388"/>
  <path class="flow" d="M 404 400 C 430 400, 430 406, 456 406"/>
  <path class="flow" d="M 804 396 C 830 396, 830 600, 868 600"/>

  <!-- step badges -->
  <circle class="stepbg" cx="436" cy="200" r="10"/><text class="step" x="432" y="204">1</text>
  <circle class="stepbg" cx="830" cy="176" r="10"/><text class="step" x="826" y="180">1</text>
  <circle class="stepbg" cx="830" cy="430" r="10"/><text class="step" x="826" y="434">2</text>
  <circle class="stepbg" cx="436" cy="572" r="10"/><text class="step" x="432" y="576">2</text>
  <circle class="stepbg" cx="830" cy="535" r="10"/><text class="step" x="826" y="539">3</text>
  <circle class="stepbg" cx="436" cy="340" r="10"/><text class="step" x="432" y="344">3</text>

  <!-- legend -->
  <text class="muted" x="20" y="748"><tspan class="step">1</tspan>  the workers' AgentCards replicate into every peer's ad-cache and become the orchestrator's tools</text>
  <text class="muted" x="20" y="766" fill="#4c6a8a"><tspan class="step">2</tspan>  each model round-trip is a ModelRequest the worker's ModelServer answers through the model-requests space</text>
  <text class="muted" x="20" y="784"><tspan class="step">3</tspan>  a tool call is an entry the agent takes and completes in the tasks space; the result returns to the model as a tool message</text>
</svg>
